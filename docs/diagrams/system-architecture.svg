<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4A42"/></marker></defs><rect width="100%" height="100%" fill="#F7F3EA"/><text x="40" y="44" font-size="26" font-weight="700" fill="#14271F">System architecture (MOCCAE pilot)</text><rect x="290" y="80" width="1120" height="750" rx="18" fill="none" stroke="#B68A35" stroke-width="2" stroke-dasharray="10 7"/><text x="310" y="814" font-size="16" font-style="italic" fill="#B68A35">Runs inside the UAE: MOCCAE server or UAE sovereign cloud. All models run locally.</text><rect x="40" y="200" width="210" height="170" rx="14" fill="#E9DFC8" stroke="#B68A35" stroke-width="2.5"/><text x="145.0" y="249.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Camera traps</text><text x="145.0" y="285.5" text-anchor="middle" font-size="17" fill="#5E6963">motion / heat trigger</text><text x="145.0" y="311.5" text-anchor="middle" font-size="17" fill="#5E6963">bursts of 3–10 frames</text><text x="145.0" y="337.5" text-anchor="middle" font-size="17" fill="#5E6963">GPS per camera</text><rect x="320" y="200" width="230" height="170" rx="14" fill="white" stroke="#1F5C45" stroke-width="2.5"/><text x="435.0" y="249.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Ingest</text><text x="435.0" y="285.5" text-anchor="middle" font-size="17" fill="#5E6963">SD card upload or LTE</text><text x="435.0" y="311.5" text-anchor="middle" font-size="17" fill="#5E6963">read EXIF timestamp</text><text x="435.0" y="337.5" text-anchor="middle" font-size="17" fill="#5E6963">link to camera</text><rect x="600" y="130" width="400" height="270" rx="14" fill="#14271F" stroke="#B68A35" stroke-width="2.5"/><text x="622" y="168" font-size="21" font-weight="700" fill="#F7F3EA">AI pipeline (GPU workers)</text><text x="622" y="206" font-size="17" fill="#D8C9A3">1  Enhance night / IR frames</text><text x="622" y="234" font-size="17" fill="#D8C9A3">2  Detect: MegaDetector V6 (MIT)</text><text x="622" y="262" font-size="17" fill="#D8C9A3">3  Blur people and vehicles</text><text x="622" y="290" font-size="17" fill="#D8C9A3">4  Classify: SpeciesNet, UAE species</text><text x="622" y="318" font-size="17" fill="#D8C9A3">5  Combine all frames of a burst</text><text x="622" y="346" font-size="17" fill="#D8C9A3">6  Route by confidence</text><rect x="1080" y="200" width="300" height="170" rx="14" fill="#F6E7C8" stroke="#B68A35" stroke-width="2.5"/><text x="1230.0" y="262.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Expert review queue</text><text x="1230.0" y="298.5" text-anchor="middle" font-size="17" fill="#5E6963">only bursts under 90%</text><text x="1230.0" y="324.5" text-anchor="middle" font-size="17" fill="#5E6963">confirm / correct / reject</text><rect x="600" y="540" width="400" height="170" rx="14" fill="white" stroke="#1F5C45" stroke-width="2.5"/><text x="800.0" y="602.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Observation database</text><text x="800.0" y="638.5" text-anchor="middle" font-size="17" fill="#5E6963">PostgreSQL + PostGIS, image store</text><text x="800.0" y="664.5" text-anchor="middle" font-size="17" fill="#5E6963">audit trail: model, reviewer, time</text><rect x="1080" y="540" width="300" height="170" rx="14" fill="#DCEBE2" stroke="#1F5C45" stroke-width="2.5"/><text x="1230.0" y="602.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Insights dashboard</text><text x="1230.0" y="638.5" text-anchor="middle" font-size="17" fill="#5E6963">species map, activity by hour</text><text x="1230.0" y="664.5" text-anchor="middle" font-size="17" fill="#5E6963">trends, coverage gaps</text><rect x="1080" y="735" width="300" height="70" rx="14" fill="#ECEBE7" stroke="#9AA19D" stroke-width="2.5"/><text x="1230.0" y="777.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Export: Camtrap DP</text><path d="M250,285 L316,285" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M550,285 L596,285" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M1000,285 L1076,285" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="1011.375" y="252" width="57.25" height="24" rx="6" fill="#F7F3EA"/><text x="1040" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">&lt; 90%</text><path d="M720,400 L720,536" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="629.5" y="454" width="181.0" height="24" rx="6" fill="#F7F3EA"/><text x="720" y="471" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">≥ 90%: auto-accepted</text><path d="M1230,370 L1230,470 L940,470 L940,536" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="1054.875" y="454" width="90.25" height="24" rx="6" fill="#F7F3EA"/><text x="1100" y="471" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">validated</text><path d="M1000,625 L1076,625" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M1230,710 L1230,731" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M1230,200 L1230,108 L800,108 L800,126" fill="none" stroke="#3B4A42" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#head)"/><rect x="887.375" y="92" width="255.25000000000003" height="24" rx="6" fill="#F7F3EA"/><text x="1015" y="109" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">corrections retrain the model</text></svg>