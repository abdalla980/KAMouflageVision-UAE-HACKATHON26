<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4A42"/></marker></defs><rect width="100%" height="100%" fill="#F7F3EA"/><text x="40" y="44" font-size="26" font-weight="700" fill="#14271F">What happens to one burst of photos</text><rect x="40" y="260" width="200" height="120" rx="14" fill="#E9DFC8" stroke="#B68A35" stroke-width="2.5"/><text x="140.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Burst</text><text x="140.0" y="333.5" text-anchor="middle" font-size="17" fill="#5E6963">3–10 frames</text><text x="140.0" y="359.5" text-anchor="middle" font-size="17" fill="#5E6963">one trigger</text><rect x="280" y="260" width="200" height="120" rx="14" fill="white" stroke="#1F5C45" stroke-width="2.5"/><text x="380.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Enhance</text><text x="380.0" y="333.5" text-anchor="middle" font-size="17" fill="#5E6963">brighten night/IR</text><text x="380.0" y="359.5" text-anchor="middle" font-size="17" fill="#5E6963">stretch contrast</text><rect x="520" y="260" width="200" height="120" rx="14" fill="#14271F" stroke="#B68A35" stroke-width="2.5"/><text x="620.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#F7F3EA">Detect</text><text x="620.0" y="333.5" text-anchor="middle" font-size="17" fill="#D8C9A3">MegaDetector V6</text><text x="620.0" y="359.5" text-anchor="middle" font-size="17" fill="#D8C9A3">MIT license</text><rect x="760" y="260" width="200" height="120" rx="14" fill="#14271F" stroke="#B68A35" stroke-width="2.5"/><text x="860.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#F7F3EA">Classify</text><text x="860.0" y="333.5" text-anchor="middle" font-size="17" fill="#D8C9A3">SpeciesNet</text><text x="860.0" y="359.5" text-anchor="middle" font-size="17" fill="#D8C9A3">UAE species only</text><rect x="1000" y="260" width="200" height="120" rx="14" fill="white" stroke="#1F5C45" stroke-width="2.5"/><text x="1100.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Burst vote</text><text x="1100.0" y="333.5" text-anchor="middle" font-size="17" fill="#5E6963">combine frames,</text><text x="1100.0" y="359.5" text-anchor="middle" font-size="17" fill="#5E6963">best frame wins</text><rect x="1240" y="260" width="200" height="120" rx="14" fill="white" stroke="#1F5C45" stroke-width="2.5"/><text x="1340.0" y="297.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Confidence</text><text x="1340.0" y="333.5" text-anchor="middle" font-size="17" fill="#5E6963">burst score</text><text x="1340.0" y="359.5" text-anchor="middle" font-size="17" fill="#5E6963">0 – 100%</text><path d="M240,320.0 L276,320.0" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M480,320.0 L516,320.0" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M720,320.0 L756,320.0" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M960,320.0 L996,320.0" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M1200,320.0 L1236,320.0" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="500" y="80" width="240" height="90" rx="14" fill="#ECEBE7" stroke="#9AA19D" stroke-width="2.5"/><text x="620.0" y="132.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Empty: filtered out</text><rect x="500" y="480" width="240" height="90" rx="14" fill="#ECEBE7" stroke="#9AA19D" stroke-width="2.5"/><text x="620.0" y="532.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Person: blurred</text><path d="M620,260 L620,174" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="574.875" y="202" width="90.25" height="24" rx="6" fill="#F7F3EA"/><text x="620" y="219" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">no animal</text><path d="M620,380 L620,476" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><rect x="546.0" y="414" width="148.0" height="24" rx="6" fill="#F7F3EA"/><text x="620" y="431" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5C45">person / vehicle</text><rect x="1220" y="80" width="240" height="90" rx="14" fill="#DCEBE2" stroke="#1F5C45" stroke-width="2.5"/><text x="1340.0" y="115.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Auto-accepted</text><text x="1340.0" y="151.5" text-anchor="middle" font-size="17" fill="#5E6963">90% or more</text><rect x="1220" y="480" width="240" height="90" rx="14" fill="#F6E7C8" stroke="#B68A35" stroke-width="2.5"/><text x="1340.0" y="515.5" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2A23">Expert review</text><text x="1340.0" y="551.5" text-anchor="middle" font-size="17" fill="#5E6963">under 90%</text><path d="M1340,260 L1340,174" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/><path d="M1340,380 L1340,476" fill="none" stroke="#3B4A42" stroke-width="2.5" marker-end="url(#head)"/></svg>